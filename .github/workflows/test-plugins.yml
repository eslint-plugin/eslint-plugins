name: Test plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-eslint-plugin-jsx-a11y:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        eslint-version: [7, 8, 9, 10]

    name: eslint-plugin-jsx-a11y - ESLint v${{ matrix.eslint-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Install ESLint v${{ matrix.eslint-version }}
        run: cd packages/eslint-plugin-jsx-a11y && bun add eslint@${{ matrix.eslint-version }} --no-save

      - name: Build (${{ matrix.os }})
        run: bun run build

      - name: Run tests (${{ matrix.os }})
        run: bun run --cwd packages/eslint-plugin-jsx-a11y test

  test-eslint-plugin-react:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        eslint-version: [7, 8, 9]

    name: eslint-plugin-react - ESLint v${{ matrix.eslint-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun ci

      - name: Install ESLint v${{ matrix.eslint-version }}
        run: cd packages/eslint-plugin-react && bun add eslint@${{ matrix.eslint-version }} --no-save

      - name: Build (${{ matrix.os }})
        run: bun run build

      - name: Run tests (${{ matrix.os }})
        run: bun run --cwd packages/eslint-plugin-react test
